<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <link rel="stylesheet" href="midi.css">
  <title>MIDItap</title>
</head>
<body>
  <div id="titlebar"></div>

  <main class="app">
    <div class="beacon-wrap" aria-hidden="true">
      <svg height="1rem" width="1rem" viewBox="0 0 16 16">
        <circle id="beatBeacon" cx="8" cy="8" r="8" />
      </svg>
    </div>
    <div id="midicenter" class="bpm electron-drag" title="Current BPM">60</div>
    <button type="button" id="tapButton" class="tap-btn">TAP</button>
  </main>

  <button type="button" id="footerToggle" class="footer-toggle" aria-label="Toggle settings" title="Settings">⚙</button>

  <footer id="settingsFooter" class="settings hidden">
    <label class="field">
      <span>In</span>
      <select id="midiInput">
        <option value="" selected disabled>-no MIDI-In-</option>
      </select>
    </label>
    <label class="field">
      <span>Out</span>
      <select id="midiOutput">
        <option value="" selected disabled>-no MIDI-Out-</option>
      </select>
    </label>
    <button type="button" id="settings-confirm-start-button" class="start-btn">select and start</button>
    <p class="last-msg">last in msg: <span id="midimsg">none</span></p>
    <p class="version">MIDItap v2.0.0 <small>lclausing.com</small></p>
  </footer>

  <script src="midi.js" type="module"></script>
</body>
</html>
